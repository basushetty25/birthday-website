<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday!</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
  <div class="background"></div>
  <div class="container">
    <h1 class="fade-in">Happy Birthday, Shobha!</h1>
    <p class="fade-in delay">"Happy Birthday! You make the world brighter just by being in it.            Wishing you joy, love, and cake!</p>

    <div class="gallery fade-in delay">
      <img src="images/shobha.jpg" alt="Cake" class="decor-img" />
      <img src="images/photo2.jpg" alt="Balloons" class="decor-img" />
      <img src="images/photo1.jpg" alt="Decoration" class="decor-img" />
    </div>

    <div class="wishes-section fade-in delay2">
      <img src="images/photo.jpg" alt="Wish 1" />
      <img src="images/shobha1.jpg" alt="Wish 2" />
    </div>

    <button onclick="showSurprise()" class="surprise-btn fade-in delay3">
      Click for a Surprise
    </button>

    <div id="messageModal" class="modal">
      <div class="modal-content">
        <span onclick="closeModal()" class="close">&times;</span>
        <h2>Surprise!</h2>
        <p class="surprise-text">Watch this special video Shobha,just for you!</p>
        
        <video class="surprise-video" controls autoplay>
          <source src="media/video1.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
    </div>  

   

    <button onclick="toggleMusic()" class="music-btn fade-in delay4">
      <i class="ri-music-2-fill"></i> Play/Pause Music
    </button>
  </div>

  <audio id="birthdayAudio" autoplay loop>
    <source src="media/birthday.mp3" type="audio/mpeg" />
  </audio>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
